[project]
name = "perexchange-cli"
version = "1.0.0"
description = "CLI tool for perexchange (dev/local use only)"
requires-python = ">=3.10"

authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" }
]

license = "Apache-2.0"

dependencies = [
    "perexchange>=2.0.0",
]

[project.scripts]
perexchange = "perexchange_cli.main:main"

[tool.uv.sources]
perexchange = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
