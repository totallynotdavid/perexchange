[project]
name = "perexchange"
version = "2.0.0"
description = "Library for fetching Peruvian exchange rates"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" }
]

license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx[http2]>=0.28.1",
    "lxml>=6.1.2",
]

[project.urls]
Homepage = "https://github.com/totallynotdavid/perexchange"
Repository = "https://github.com/totallynotdavid/perexchange"
Issues = "https://github.com/totallynotdavid/perexchange/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
