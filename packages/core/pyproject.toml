[project]
name = "perexchange"
version = "1.0.0"
description = "Library for fetching Peruvian exchange rates"
readme = "readme.md"
requires-python = ">=3.10"

authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" }
]

license = "MIT"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx[http2]>=0.28.1",
    "lxml>=6.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
