name: site

on:
  push:
    branches: ["master"]
    paths: &paths
      - "site/**"
      - "tools/snapshot.py"
      - "tools/hours.py"
      - "tools/collect.py"
      - "tools/history_report.py"
      - "packages/core/perexchange/**"
      - "packages/core/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "docs/**"
      - "packages/cli/README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.14.0"

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - run: uv python install

      - run: uv sync --locked --all-packages --extra dev

      - run: bun install --frozen-lockfile
        working-directory: site

      - run:
          uv run pytest packages/core/tests/unit/test_snapshot.py
          packages/core/tests/unit/test_hours.py packages/core/tests/unit/test_collect.py
          packages/core/tests/unit/test_history_report.py
      - run: bun run check
        working-directory: site
