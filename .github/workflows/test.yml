name: test

on:
  push:
    branches: ["master"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10.0", "3.14.0"]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ matrix.python }}

      - run: |
          uv lock --check
          uv sync --locked --all-packages --extra dev

      - run: >-
          uv run pytest -v -m "not integration" --cov=perexchange --cov-report=xml
          --junitxml=junit.xml

      - run: uv run ruff format --check .
      - run: uv run ruff check --no-fix .
      - run: uv run mypy

      - if: matrix.python == '3.14.0'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          report_type: coverage

      - if: matrix.python == '3.14.0'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./junit.xml
          report_type: test_results

      - if: matrix.python == '3.14.0'
        run: uv run --extra dev python tools/build_check.py

  integration:
    runs-on: ubuntu-latest
    if:
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master'

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.14.0

      - run: |
          uv lock --check
          uv sync --locked --all-packages --extra dev

      - id: test
        run: uv run pytest -v -m integration --tb=short
        continue-on-error: true

      - if:
          failure() && steps.test.outcome == 'failure' && (github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'integration-test-failure'
            });

            const body = `Run: \`pytest -m integration\`\n\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'fix: integration tests failing',
                body: body,
                labels: ['integration-test-failure', 'bug']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
            }

  docs:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun x oxfmt@0.65.0 "**/*.{md,yml}" --check
