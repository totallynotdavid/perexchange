[settings]
python.uv_venv_auto = "source"

[tools]
python = "3.15.0"
uv = "0.13.1"
node = "24.22.0"
bun = "1.4.3"
oxfmt = "0.74.0"

[tasks.install]
description = "Install every dependency from the lockfiles"
depends = ["install:*"]

[tasks."install:py"]
description = "Install the Python workspace and its dev extra from uv.lock"
run = "uv sync --locked --all-packages --extra dev"

[tasks."install:site"]
description = "Install the site dependencies from bun.lock"
run = "bun install --frozen-lockfile"
dir = "site"

[tasks.upgrade]
description = "Upgrade the Python dependencies to their newest versions and rewrite uv.lock"
alias = "u"
run = ["uv lock --upgrade", "uv sync --locked --all-packages --extra dev"]

[tasks.lint]
description = "Check Python, Markdown, YAML, JSON and site formatting and lint"
depends = ["lint:*"]

[tasks."lint:py"]
description = "Check Python lint and formatting with ruff"
run = ["uv run ruff check --no-fix .", "uv run ruff format --check ."]

[tasks."lint:format"]
description = "Check Markdown, YAML, JSON and TypeScript formatting with oxfmt"
run = "oxfmt --check ."

[tasks."lint:site"]
description = "Check the site with oxlint, and its .astro files with Prettier"
run = [
  "bun x oxlint --deny-warnings",
  "bun x prettier --plugin prettier-plugin-astro --print-width 120 --check \"src/**/*.astro\"",
]
dir = "site"

[tasks.fix]
description = "Apply safe lint fixes and format every file type"
run = [{ task = "fix:py" }, { task = "fix:site" }, { task = "fix:format" }]

[tasks."fix:py"]
description = "Fix Python lint and format it with ruff"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."fix:format"]
description = "Format Markdown, YAML, JSON and TypeScript with oxfmt"
run = "oxfmt --write ."

[tasks."fix:site"]
description = "Fix the site with oxlint, and format its .astro files with Prettier"
run = [
  "bun x oxlint --fix",
  "bun x prettier --plugin prettier-plugin-astro --print-width 120 --write \"src/**/*.astro\"",
]
dir = "site"

[tasks.typecheck]
description = "Type-check the Python code and the site"
depends = ["typecheck:*"]

[tasks."typecheck:py"]
description = "Type-check the Python code with mypy"
run = "uv run mypy"

[tasks."typecheck:site"]
description = "Type-check the site with astro check"
run = "bun x astro check"
dir = "site"

[tasks.test]
description = "Run the unit tests of the packages and the site"
depends = ["test:py", "test:site"]

[tasks."test:py"]
description = "Run the core unit tests with coverage and a JUnit report"
run = "uv run pytest packages/core --cov=perexchange --cov-report=xml --junitxml=junit.xml"

[tasks."test:site"]
description = "Check colour contrast, then run the site tests"
run = ["node scripts/check-contrast.ts", "bun x vitest run"]
dir = "site"

[tasks."test:integration"]
description = "Run the core tests that call the live exchange houses"
run = "uv run pytest packages/core -m integration --tb=short"

[tasks."test:min-python"]
description = "Run the core unit tests on the oldest supported Python in a throwaway environment"
run = "uv run --isolated --locked --python 3.12 --all-packages --extra dev pytest packages/core"

[tasks.build]
description = "Build and verify the package in a temporary directory, then build the site into site/dist"
run = ["uv run python tools/build_check.py", "bun run --cwd site build"]

[tasks.check]
description = "Run every check CI runs: lint, typecheck, test and build"
depends = ["lint", "typecheck", "test", "build"]

[tasks.dist]
description = "Build the sdist and wheel into packages/core/dist and check them with twine"
run = [
  "uv build --sdist --wheel --out-dir packages/core/dist packages/core",
  "uv run python -m twine check packages/core/dist/*",
]

[tasks.release]
description = "Bump the version, lock, check, commit, tag and push a release"
usage = '''
arg "<version>" help="The new version, for example 2.1.0"
flag "--dry-run" help="Check the preconditions and stop"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=("${usage_version?}")
if [ "${usage_dry_run:-false}" = "true" ]; then
  args+=(--dry-run)
fi
exec uv run python tools/release.py "${args[@]}"
'''

[tasks."data:site"]
description = "Fetch every source once and record a snapshot for the site"
run = "uv run python tools/snapshot.py --data-dir site/data"

[tasks.collect]
description = "Record snapshots into site/data for 330 minutes, one every 15"
run = "uv run python tools/collect.py --data-dir site/data --minutes 330 --interval 15"

[tasks."report:snapshot"]
description = "Print a workflow warning naming the sources that did not answer"
run = "bun site/scripts/report-failures.ts"
