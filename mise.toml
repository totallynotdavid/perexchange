[settings]
python.uv_venv_auto = "source"

[tools]
uv = "0.12.7"
ruff = "0.16.5"
bun = "1.4.0"

[tasks.sync]
description = "Sync dependencies for all packages and dev"
run = "uv sync --all-packages --extra dev"

[tasks.test]
description = "Run tests for core package"
run = "uv run pytest packages/core"

[tasks.test-integration]
description = "Run integration tests for core package"
run = "uv run pytest packages/core -m integration"

[tasks.format]
description = "Format all packages"
run = "ruff format . && ruff check --fix ."

[tasks.format-check]
description = "Check Python formatting and lint"
run = "ruff format --check . && ruff check --no-fix ."

[tasks.format-docs]
description = "Format all *.md and *.yml files"
run = "bun x oxfmt@0.65.0 \"**/*.{md,yml}\" --write"

[tasks.format-docs-check]
description = "Check Markdown and YAML formatting"
run = "bun x oxfmt@0.65.0 \"**/*.{md,yml}\" --check"

[tasks.lint]
description = "Run type checking"
run = "uv run mypy"

[tasks.update]
description = "Update dependencies for all packages"
alias = "u"
run = ["uv sync --all-packages --extra dev -U"]

[tasks.build]
description = "Build core package"
run = "uv build"
dir = "packages/core"

[tasks.build-check]
description = "Build and verify package contents"
run = "uv run --extra dev python tools/build_check.py"

[tasks.release]
description = "Bump the version, lock, check, commit, tag and push a release"
usage = '''
arg "<version>" help="The new version, for example 2.1.0"
flag "--dry-run" help="Check the preconditions and stop"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=("${usage_version?}")
if [ "${usage_dry_run:-false}" = "true" ]; then
  args+=(--dry-run)
fi
exec uv run --extra dev python tools/release.py "${args[@]}"
'''

[tasks.site-data]
description = "Fetch every source once and record a snapshot for the site"
run = "bun install --frozen-lockfile && bun run data"
dir = "site"

[tasks.site-dev]
description = "Serve the site with live reload, from the recorded snapshot"
run = "bun install --frozen-lockfile && bun run dev"
dir = "site"

[tasks.site-build]
description = "Build the site into site/dist"
run = "bun install --frozen-lockfile && bun run build"
dir = "site"

[tasks.site-check]
description = "Type-check, lint, format-check and test the site"
run = "bun install --frozen-lockfile && bun run check"
dir = "site"

[tasks.check]
description = "Run formatting, lint, tests, and package checks"
depends = ["format-check", "format-docs-check", "lint", "test", "build-check", "site-check"]
